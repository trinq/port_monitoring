[General]
output_dir = ./port_monitor_output

[Scan]
# File containing list of IP addresses to scan
ip_list_file = unique_ips.txt
# How often to run scans (in minutes)
scan_interval_minutes = 240
# Scan delay between probes
scan_delay = 0.5s
# Maximum rate of packet transmission
max_rate = 100
# Port ranges to scan
ports = 1-1000,1022-1099,1433-1434,1521,2222,3306-3310,3389,5432,5900-5910,8000-8999

# Enhanced Service Detection (Sprint 1 Features)
# Timing template (0-5, higher is faster but less reliable)
# 0=paranoid, 1=sneaky, 2=polite, 3=normal, 4=aggressive, 5=insane
timing_template = 3

# Enable aggressive service detection for better version identification
# This uses --version-intensity 7 (more probes, more accurate)
aggressive_service_detection = true

# Enable nmap scripts for banner grabbing and service details
# Scripts: banner, http-server-header, http-title, ssh-hostkey, ssl-cert, tls-nextprotoneg
enable_scripts = true

# Legacy options (kept for backward compatibility)
use_http_headers = true
http_user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.3

[Notification]
# Enable notifications
enabled = true
# Send alert for each IP after it's scanned
individual_ip_alerts = true

[Email]
enabled = false
smtp_server = smtp.example.com
smtp_port = 587
smtp_user = username
smtp_password = password
sender_email = alerts@example.com
recipient_emails = admin@example.com,security@example.com

[Slack]
enabled = false
webhook_url = https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK

[Telegram]
enabled = true
bot_token = YOUR_BOT_TOKEN
chat_id = YOUR_CHAT_ID